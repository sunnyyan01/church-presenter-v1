<div class="dialog-inner">
    <h1>{{editIn().mode}} {{editIn().type}}</h1>
    <div class="toolbar">
        <div
            class="button icon-button"
            (click)="loadFromLibrary()"
        >
            <img src="icons/open-folder.svg" title="Load from library">
        </div>
        <div
            class="button icon-button"
            (click)="saveToLibrary()"
        >
            <img src="icons/save.svg" title="Save to library">
        </div>
        <div
            class="button icon-button toggle-button"
            [class.hidden]="slide()['subtype'] != 'content'"
            [attr.data-active]="autoBibleMenuOpen()"
            (click)="openAutoBibleMenu()"
        >
            <img src="icons/book.svg" title="Auto bible lookup">
        </div>
        @if (autoBibleMenuOpen()) {
            <div
                class="dropdown-outer dropdown-inner"
                #autoBibleMenu
            >
                <label for="version-input">
                    Version:
                    <input
                        id="version-input" list="common-versions"
                        [(value)]="autoBibleVersion" (change)="changeAutoBibleVersion($event)"
                        placeholder="CUVMPS"
                    >
                </label>
                <datalist id="common-versions">
                    <option value="CUVMPS">Chinese Union Version (Modern Punct., Simplified)</option>
                    <option value="CUVMPT">Chinese Union Version (Modern Punct., Traditional)</option>
                    <option value="NIV">New International Version</option>
                </datalist>
                <div class="button text-button" (click)="autoBible()">Go</div>
            </div>
        }
        <div
            class="button icon-button"
            [class.hidden]="slide()['subtype'] != 'welcome'"
            (click)="autoDate()"
        >
            <img src="icons/calendar.svg" title="Auto date">
        </div>
    </div>
    <div class="table">
        @for (field of slideEntries().values(); track field[0]) {
            <edit-field
                [field]="field" [slide]="$any(slide())"
                (valChange)="onChange(field[0], $event)"
            />
        }
    </div>
    <div class="buttons">
        <div class="button text-button large secondary" (click)="onClose()">
            Cancel
        </div>
        <div class="button text-button large primary" (click)="onSave()">
            Save
        </div>
    </div>
</div>
